schema: spec-driven

context: |
  Project: codepilot
  Detected stack: documentation-first repo; no application manifests or source code were found.
  Architecture: no executable architecture detected yet.
  Testing: no test runner, coverage, linter, formatter, or type checker detected.
  Style: Markdown-heavy repository with a Python-oriented .gitignore.

strict_tdd: false

testing:
  detected: 2026-08-02
  test_runner:
    command: ""
    framework: none
  layers:
    unit: false
    integration: false
    e2e: false
  coverage:
    available: false
    command: ""
  quality_tools:
    linter: ""
    type_checker: ""
    formatter: ""

rules:
  proposal:
    - Include rollback plan for risky changes
  specs:
    - Use Given/When/Then for scenarios
    - Use RFC 2119 keywords (MUST, SHALL, SHOULD, MAY)
  design:
    - Document architecture decisions with rationale
  tasks:
    - Group by phase, use hierarchical numbering
    - Keep tasks completable in one session
  apply:
    - Follow existing code patterns
    - tdd: false
    - test_command: ""
  verify:
    - test_command: ""
    - build_command: ""
    - coverage_threshold: 0
  archive:
    - Warn before merging destructive deltas
