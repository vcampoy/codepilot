name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]" pip-audit
      - name: Lint
        run: ruff check .
      - name: Check formatting
        run: ruff format --check .
      - name: Type-check
        run: mypy
      - name: Test
        run: pytest
      - name: Dependency audit
        run: pip-audit

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Test
        run: npm test
      - name: Dependency audit
        run: npm audit --omit=dev --audit-level=high

  compose-smoke:
    name: Compose smoke test
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Start the Compose stack
        run: docker compose up --build --wait --wait-timeout 120
      - name: Check API health
        run: curl --fail --retry 10 --retry-delay 2 --retry-connrefused http://localhost:8000/health
      - name: Check repository-ingestion runtime
        run: docker compose exec -T worker sh -c 'git --version && test -r /etc/ssl/certs/ca-certificates.crt'
      - name: Check frontend root
        run: curl --fail --retry 10 --retry-delay 2 --retry-connrefused http://localhost:5173/
      - name: Check frontend SPA fallback
        run: curl --fail --retry 10 --retry-delay 2 --retry-connrefused http://localhost:5173/analysis/example
      - name: Print service logs on failure
        if: ${{ failure() }}
        run: docker compose logs --no-color
      - name: Stop the Compose stack
        if: ${{ always() }}
        run: docker compose down --volumes
