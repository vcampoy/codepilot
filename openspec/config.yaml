schema: spec-driven

context: |
  Project: codepilot
  Stack: Python 3.13 FastAPI/Celery backend; React 19, TypeScript, and Vite frontend.
  Runtime: Docker Compose orchestrates API, worker, PostgreSQL, Redis, and static frontend.
  Architecture: layered backend boundaries with deterministic analysis as the source of truth.
  Testing: pytest unit/integration coverage; Ruff, Mypy, and frontend TypeScript/Vite build checks.
  Style: English Markdown; 4-space Python, 2-space frontend; strict typing and explicit boundaries.

strict_tdd: false

artifact_store: openspec

workflow:
  execution_mode: interactive
  chained_pr_strategy: ask-always
  review_budget_lines: 400

testing:
  detected: 2026-08-03
  test_runner:
    command: "python -m pytest"
    framework: pytest
  layers:
    unit: true
    integration: true
    e2e: false
  coverage:
    available: false
    command: ""
  quality_tools:
    linter: "ruff check ."
    type_checker: "mypy"
    formatter: "ruff format --check ."
  frontend:
    build_and_type_check: "npm run build"
    linter: ""
    formatter: ""
    e2e: ""

rules:
  proposal:
    - Include rollback plan for risky changes
  specs:
    - Use Given/When/Then for scenarios
    - Use RFC 2119 keywords (MUST, SHALL, SHOULD, MAY)
  design:
    - Document architecture decisions with rationale
  tasks:
    - Group by phase, use hierarchical numbering
    - Keep tasks completable in one session
  apply:
    rules:
      - Follow existing code patterns
      - Use RED-GREEN-REFACTOR when strict_tdd is enabled
      - Keep deterministic analysis authoritative over optional AI enrichment
    tdd: false
    test_command: "python -m pytest"
  verify:
    test_command: "python -m pytest"
    build_command: "npm run build"
    coverage_threshold: 0
  archive:
    - Warn before merging destructive deltas
