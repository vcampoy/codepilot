name: codepilot

x-runtime-hardening: &runtime-hardening
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-codepilot}
      POSTGRES_USER: ${POSTGRES_USER:-codepilot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-codepilot}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  migration:
    build:
      context: ./backend
    command: alembic upgrade head
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-codepilot}:${POSTGRES_PASSWORD:-codepilot}@postgres:5432/${POSTGRES_DB:-codepilot}
    depends_on:
      postgres:
        condition: service_healthy

  api:
    <<: *runtime-hardening
    build:
      context: ./backend
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-codepilot}:${POSTGRES_PASSWORD:-codepilot}@postgres:5432/${POSTGRES_DB:-codepilot}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:-redis://redis:6379/0}
      CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND:-redis://redis:6379/1}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      LOG_FORMAT: ${LOG_FORMAT:-json}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
      REPOSITORY_MAX_SIZE_BYTES: ${REPOSITORY_MAX_SIZE_BYTES:-100000000}
      REPOSITORY_MAX_FILE_COUNT: ${REPOSITORY_MAX_FILE_COUNT:-50000}
      ANALYSIS_TIMEOUT_SECONDS: ${ANALYSIS_TIMEOUT_SECONDS:-300}
      AUTH_REQUIRED: ${AUTH_REQUIRED:-false}
      AUTH_API_KEY: ${AUTH_API_KEY:-}
      RATE_LIMIT_REQUESTS: ${RATE_LIMIT_REQUESTS:-120}
      RATE_LIMIT_WINDOW_SECONDS: ${RATE_LIMIT_WINDOW_SECONDS:-60}
      WORKSPACE_ANALYSIS_QUOTA: ${WORKSPACE_ANALYSIS_QUOTA:-100}
      GITHUB_ENABLED: ${GITHUB_ENABLED:-false}
      GITHUB_APP_ID: ${GITHUB_APP_ID:-}
      GITHUB_PRIVATE_KEY: ${GITHUB_PRIVATE_KEY:-}
      GITHUB_WEBHOOK_SECRET: ${GITHUB_WEBHOOK_SECRET:-}
      OBSERVABILITY_ENABLED: ${OBSERVABILITY_ENABLED:-false}
      OTEL_SERVICE_NAME: ${OTEL_SERVICE_NAME:-codepilot-api}
      ERROR_REPORTING_DSN: ${ERROR_REPORTING_DSN:-}
      QUALITY_GATE_MAX_NEW_CRITICAL_FINDINGS: ${QUALITY_GATE_MAX_NEW_CRITICAL_FINDINGS:-}
      QUALITY_GATE_MAX_RISK_SCORE: ${QUALITY_GATE_MAX_RISK_SCORE:-}
      QUALITY_GATE_MAX_NEW_HOTSPOTS: ${QUALITY_GATE_MAX_NEW_HOTSPOTS:-}
      LLM_ENABLED: ${LLM_ENABLED:-false}
      LLM_PROVIDER: ${LLM_PROVIDER:-}
      LLM_MODEL: ${LLM_MODEL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
    ports:
      - "${API_PORT:-8000}:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"
      interval: 5s
      timeout: 5s
      retries: 10
    depends_on:
      migration:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    <<: *runtime-hardening
    build:
      context: ./backend
      target: worker
    command: celery -A codepilot.worker.celery_app:celery_app worker --loglevel=INFO
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-codepilot}:${POSTGRES_PASSWORD:-codepilot}@postgres:5432/${POSTGRES_DB:-codepilot}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:-redis://redis:6379/0}
      CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND:-redis://redis:6379/1}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      LOG_FORMAT: ${LOG_FORMAT:-json}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
      REPOSITORY_MAX_SIZE_BYTES: ${REPOSITORY_MAX_SIZE_BYTES:-100000000}
      REPOSITORY_MAX_FILE_COUNT: ${REPOSITORY_MAX_FILE_COUNT:-50000}
      ANALYSIS_TIMEOUT_SECONDS: ${ANALYSIS_TIMEOUT_SECONDS:-300}
      ANALYSIS_RECOVERY_INTERVAL_SECONDS: ${ANALYSIS_RECOVERY_INTERVAL_SECONDS:-60}
      QUALITY_GATE_MAX_NEW_CRITICAL_FINDINGS: ${QUALITY_GATE_MAX_NEW_CRITICAL_FINDINGS:-}
      QUALITY_GATE_MAX_RISK_SCORE: ${QUALITY_GATE_MAX_RISK_SCORE:-}
      QUALITY_GATE_MAX_NEW_HOTSPOTS: ${QUALITY_GATE_MAX_NEW_HOTSPOTS:-}
      LLM_ENABLED: ${LLM_ENABLED:-false}
      LLM_PROVIDER: ${LLM_PROVIDER:-}
      LLM_MODEL: ${LLM_MODEL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
    depends_on:
      migration:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  beat:
    <<: *runtime-hardening
    build:
      context: ./backend
    command: celery -A codepilot.worker.celery_app:celery_app beat --loglevel=INFO --schedule=/tmp/celerybeat-schedule
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-codepilot}:${POSTGRES_PASSWORD:-codepilot}@postgres:5432/${POSTGRES_DB:-codepilot}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:-redis://redis:6379/0}
      CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND:-redis://redis:6379/1}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      LOG_FORMAT: ${LOG_FORMAT:-json}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
      REPOSITORY_MAX_SIZE_BYTES: ${REPOSITORY_MAX_SIZE_BYTES:-100000000}
      REPOSITORY_MAX_FILE_COUNT: ${REPOSITORY_MAX_FILE_COUNT:-50000}
      ANALYSIS_TIMEOUT_SECONDS: ${ANALYSIS_TIMEOUT_SECONDS:-300}
      ANALYSIS_RECOVERY_INTERVAL_SECONDS: ${ANALYSIS_RECOVERY_INTERVAL_SECONDS:-60}
      QUALITY_GATE_MAX_NEW_CRITICAL_FINDINGS: ${QUALITY_GATE_MAX_NEW_CRITICAL_FINDINGS:-}
      QUALITY_GATE_MAX_RISK_SCORE: ${QUALITY_GATE_MAX_RISK_SCORE:-}
      QUALITY_GATE_MAX_NEW_HOTSPOTS: ${QUALITY_GATE_MAX_NEW_HOTSPOTS:-}
      LLM_ENABLED: ${LLM_ENABLED:-false}
      LLM_PROVIDER: ${LLM_PROVIDER:-}
      LLM_MODEL: ${LLM_MODEL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
    depends_on:
      migration:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  frontend:
    <<: *runtime-hardening
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000}
    ports:
      - "${FRONTEND_PORT:-5173}:8080"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1:8080/"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
  redis-data:
